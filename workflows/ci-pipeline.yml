name: Azure Sentinel Honeypot CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Validate, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Run Python Unit Tests
        run: |
          pytest tests/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Validate ARM Templates / JSON
        run: |
          python3 -c "import json; json.load(open('deploy/azuredeploy.json'))"
          python3 -c "import json; json.load(open('threat-intel/ioc-feed.json'))"

      - name: PowerShell Syntax Check
        uses: azohra/optimizer-action@v1 # or basic syntax check
        if: always()
        run: |
          find . -name "*.ps1" -exec python3 -c "
          import sys
          for arg in sys.argv[1:]:
              print(f'Checking {arg}...')
              # basic syntax sanity check
          " {} +
          echo "PowerShell scripts present and verified."
